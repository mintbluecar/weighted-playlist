<!doctype html>
<meta charset="utf-8">
<title>app.js harness</title>
<link rel="stylesheet" href="/styles.css">
<!-- Runs the real app.js and index.html against a fake YouTube player. Open with ?scenario=<name>; see run.sh. -->
<script type="module">
const scenario = new URLSearchParams(location.search).get('scenario');
const wait = ms => new Promise(r => setTimeout(r, ms));
// Check a condition every 50 ms until it's true or time runs out, instead of sleeping a fixed time.
const waitFor = async (check, ms = 3000) => {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    if (check()) return true;
    await wait(50);
  }
  return check();
};
// Reads give up after 1 s here (10 s in real use), so scenarios about failing playlists run fast.
window.loopsidedConfig = { readTimeoutMs: 1000 };
const A = 'PLAAAA', B = 'PLBBBB', A1 = 'aaaaaaaaaa1', A2 = 'aaaaaaaaaa2', B1 = 'bbbbbbbbbb1';
const C = 'PLCCCC', CS = [1, 2, 3, 4, 5].map(n => `cccccccccc${n}`);
const SLOW = 'PLSLOW', S1 = 'ssssssssss1';
const realFetch = window.fetch.bind(window);

// ---- fake YouTube IFrame API ----
const playlists = { [A]: [A1, A2], [B]: [B1], [C]: CS, [SLOW]: [S1] };
const cueDelay = { [A]: 20, [B]: 20, [C]: 20, [SLOW]: 1500 }; // SLOW answers after the 1 s read timeout
const lateAnswer = new Set([SLOW]); // like YouTube: still answers after a newer cue
const calls = { loadVideoById: [], cueVideoById: [], playVideo: 0, stopVideo: 0, cuePlaylist: {}, oembed: [] };
const blocked = new Set(); // videos that report an embedding error (150) instead of playing
let readyDelay = 0; // scenarios can delay the fake players becoming ready
window.YT = {
  Player: class {
    constructor(id, opts) {
      this.opts = opts;
      setTimeout(() => opts.events.onReady(), readyDelay);
    }
    emit(state) { if (!this.dead) this.opts.events.onStateChange({ data: state }); }
    destroy() { this.dead = true; }
    cuePlaylist({ list }) {
      calls.cuePlaylist[list] = (calls.cuePlaylist[list] ?? 0) + 1;
      this.pending = list;
      if (!playlists[list]) return; // an unknown list is never reported as cued
      setTimeout(() => {
        if (this.pending !== list && !lateAnswer.has(list)) return;
        this.list = list;
        this.emit(5);
      }, cueDelay[list]);
    }
    getPlaylist() { return playlists[this.list] ?? null; }
    fail(code) { if (!this.dead) this.opts.events.onError?.({ data: code }); }
    loadVideoById(id) { calls.loadVideoById.push(id); setTimeout(() => (blocked.has(id) ? this.fail(150) : this.emit(1)), 0); }
    cueVideoById(id) { calls.cueVideoById.push(id); setTimeout(() => (blocked.has(id) ? this.fail(150) : this.emit(5)), 0); }
    pauseVideo() { this.emit(2); }
    playVideo() { calls.playVideo++; this.emit(1); }
    stopVideo() { calls.stopVideo++; this.emit(-1); }
  },
};
// oEmbed stand-in: title is "Title <id>"
window.fetch = async url => {
  const id = decodeURIComponent(url).match(/(?:v=|list=)([A-Za-z0-9_-]+)/)?.[1] ?? '?';
  calls.oembed.push(id);
  return { ok: true, json: async () => ({ title: `Title ${id}`, author_name: 'Someone', thumbnail_url: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` }) };
};

// ---- saved state before the app starts: playlist A has a weight of 5 on its first song ----
localStorage.clear();
localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: { [A1]: 5 }, extras: [], removed: [], sourceInfo: {} }));

// ---- the real page ----
const html = await (await realFetch('/index.html')).text();
document.body.innerHTML = new DOMParser().parseFromString(html, 'text/html').body.innerHTML;
const $ = id => document.getElementById(id);
const saved = () => JSON.parse(localStorage.getItem('hr:rotation'));
function submitLink(link) {
  $('plLink').value = link;
  $('loadForm').requestSubmit();
}

const scenarios = {
  // A second playlist pasted while the first is still loading: both are read in turn and merged.
  async 'load-race'() {
    cueDelay[A] = 400;               // the startup load of A is slow...
    await import('/app.js');
    await wait(100);
    submitLink(`https://www.youtube.com/playlist?list=${B}`); // ...and B is loaded meanwhile
    await wait(2000);
    const rot = saved();
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return {
      pass: rot.weights[A1] === 5 && rot.sources.join() === [A, B].join()
        && ids.join() === [A1, A2, B1].join() && $('plName').textContent === `Title ${A} + Title ${B}`,
      rot, ids, shown: $('plName').textContent,
    };
  },

  // A playlist that can't be read while a song plays: error shown, song not interrupted, list unchanged.
  async 'failed-load'() {
    await import('/app.js');
    await wait(800);
    $('playBtn').click();
    await wait(300);
    const loadsBefore = calls.loadVideoById.length;
    const titleBefore = $('nowTitle').textContent;
    submitLink('https://www.youtube.com/playlist?list=PLXXXX');
    await wait(2000);                 // the read gives up after 1 s here
    return {
      pass: calls.loadVideoById.length === loadsBefore && $('nowTitle').textContent === titleBefore
        && $('status').classList.contains('err') && saved().sources.join() === A,
      loads: calls.loadVideoById, status: $('status').textContent, sources: saved().sources,
    };
  },

  // The "Added to…" note goes away on its own; an error message stays.
  async 'added-note-hides'() {
    await import('/app.js');
    await wait(300);
    $('addLink').value = 'https://youtu.be/cccccccccc1';
    $('addForm').requestSubmit();
    await wait(200);
    const shownAfterAdd = !$('status').hidden && $('status').classList.contains('ok');
    await wait(5000);
    const hiddenLater = $('status').hidden;
    submitLink('https://example.com/nope');
    await wait(5000);
    const errorStays = !$('status').hidden && $('status').classList.contains('err');
    return { pass: shownAfterAdd && hiddenLater && errorStays, shownAfterAdd, hiddenLater, errorStays };
  },

  // After a playlist loads, one of its songs waits in the player, paused; Play starts that song.
  async 'cued-after-load'() {
    await import('/app.js');
    await wait(300);
    const cued = calls.cueVideoById.at(-1);
    const titleBefore = $('nowTitle').textContent;
    const overlayHidden = $('videoEmpty').hidden;
    $('playBtn').click();
    await wait(100);
    return {
      pass: [A1, A2].includes(cued) && titleBefore === `Title ${cued}` && overlayHidden
        && calls.loadVideoById.length === 0 && calls.playVideo === 1,
      cued, titleBefore, overlayHidden, loads: calls.loadVideoById, plays: calls.playVideo,
    };
  },

  // Each song row shows its thumbnail, lazily loaded.
  async 'row-thumbnail'() {
    await import('/app.js');
    await wait(300);
    const img = document.querySelector(`.song[data-id="${A1}"] .thumb img`);
    return {
      pass: !!img && img.getAttribute('src') === `https://i.ytimg.com/vi/${A1}/hqdefault.jpg` && img.loading === 'lazy' && img.alt === '',
      src: img?.getAttribute('src') ?? null, loading: img?.loading ?? null,
    };
  },

  // × removes a song, remembers it, and Undo brings it back.
  async 'remove-song'() {
    await import('/app.js');
    await wait(800);
    const menuHiddenAtFirst = document.querySelector(`.song[data-id="${A2}"] .menu`)?.hidden === true;
    document.querySelector(`.song[data-id="${A2}"] [data-role="menu"]`).click();
    document.querySelector(`.song[data-id="${A2}"] [data-role="remove"]`).click();
    await wait(100);
    const goneFromList = !document.querySelector(`.song[data-id="${A2}"]`);
    const savedRemoved = saved().removed;
    const undo = [...$('status').querySelectorAll('button')].find(b => b.textContent === 'Undo');
    const note = $('status').textContent;
    undo?.click();
    await wait(100);
    const back = !!document.querySelector(`.song[data-id="${A2}"]`);
    const removedAfterUndo = saved().removed;
    return {
      pass: menuHiddenAtFirst && goneFromList && savedRemoved.includes(A2) && note.startsWith(`Removed Title ${A2}. Still on YouTube.`) && back && removedAfterUndo.length === 0,
      goneFromList, savedRemoved, note, back, removedAfterUndo,
    };
  },

  // A removed song stays out when the playlist is loaded again.
  async 'removed-stays-removed'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: [], removed: [A2], sourceInfo: {} }));
    await import('/app.js');
    await wait(800);
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id);
    return { pass: ids.length === 1 && ids[0] === A1, ids };
  },

  // Pasting a removed song's link brings it back as a playlist song, not an extra.
  async 'readd-removed'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: [], removed: [A2], sourceInfo: {} }));
    await import('/app.js');
    await wait(800);
    $('addLink').value = `https://youtu.be/${A2}`;
    $('addForm').requestSubmit();
    await wait(200);
    const rot = saved();
    const back = !!document.querySelector(`.song[data-id="${A2}"]`);
    return { pass: back && rot.removed.length === 0 && !rot.extras.includes(A2), back, rot };
  },

  // The queue box lists what plays next, with a divider where the next loop starts.
  async 'queue-box'() {
    await import('/app.js');
    await wait(800);
    const items = [...document.querySelectorAll('#queueList .qitem')];
    const first = items[0];
    return {
      pass: items.length > 0 && items.length <= 10 && !!document.querySelector('#queueList .qdivider')
        && first.querySelector('.t').textContent.startsWith('Title ') && !!first.querySelector('.thumb'),
      count: items.length, firstTitle: first?.querySelector('.t')?.textContent ?? null,
    };
  },

  // ▼ swaps a queued song with the next one; tapping a queued song plays it now,
  // and the songs it passed stay in the queue.
  async 'queue-move-jump'() {
    // five different songs at weight 1, so every queue position holds a distinct song
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [C], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    await import('/app.js');
    await wait(800);
    const idsBefore = [...document.querySelectorAll('#queueList .qitem')].map(li => li.dataset.id);
    document.querySelector('#queueList .qitem [data-dir="1"]').click();
    await wait(100);
    const idsAfter = [...document.querySelectorAll('#queueList .qitem')].map(li => li.dataset.id);
    const third = document.querySelectorAll('#queueList .qitem')[2];
    const thirdId = third.dataset.id;
    third.querySelector('.qplay').click();
    await wait(100);
    const idsNow = [...document.querySelectorAll('#queueList .qitem')].map(li => li.dataset.id);
    return {
      pass: idsAfter[0] === idsBefore[1] && idsAfter[1] === idsBefore[0]
        && calls.loadVideoById.at(-1) === thirdId && $('nowTitle').textContent === `Title ${thirdId}`
        && idsNow[0] === idsAfter[0] && idsNow[1] === idsAfter[1] && idsNow[2] === idsAfter[3],
      idsBefore, idsAfter, idsNow, loaded: calls.loadVideoById,
    };
  },

  // The queue button on a song row puts it at the top of the queue.
  async 'add-to-queue'() {
    await import('/app.js');
    await wait(800);
    const row = document.querySelector(`.song[data-id="${A2}"]`);
    row.querySelector('[data-role="menu"]').click();
    const menuOpened = !row.querySelector('.menu').hidden;
    row.querySelector('[data-role="queue"]').click();
    await wait(100);
    const menuClosed = row.querySelector('.menu').hidden;
    const top = document.querySelector('#queueList .qitem')?.dataset.id;
    return { pass: menuOpened && menuClosed && top === A2 && $('status').textContent.startsWith(`Added Title ${A2} to the queue.`), menuOpened, menuClosed, top, note: $('status').textContent };
  },

  // The pen's header collapses and expands it, and the choice is remembered.
  async 'collapse-pen'() {
    await import('/app.js');
    await wait(800);
    const toggle = $('penToggle');
    toggle.click();
    await wait(100);
    const collapsed = $('yard').hidden && toggle.getAttribute('aria-expanded') === 'false';
    const saved = JSON.parse(localStorage.getItem('hr:settings')).penCollapsed;
    toggle.click();
    await wait(100);
    const expanded = !$('yard').hidden && toggle.getAttribute('aria-expanded') === 'true';
    return { pass: collapsed && saved === true && expanded, collapsed, saved, expanded };
  },

  // Pasting another playlist adds its songs without interrupting the song that's playing.
  async 'merge-playlist'() {
    await import('/app.js');
    await wait(800);
    $('playBtn').click();
    await wait(300);
    const loadsBefore = calls.loadVideoById.length;
    const cuesBefore = calls.cueVideoById.length;
    submitLink(`https://www.youtube.com/playlist?list=${B}`);
    await wait(1000);
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return {
      pass: ids.join() === [A1, A2, B1].join() && saved().sources.join() === [A, B].join()
        && calls.loadVideoById.length === loadsBefore && calls.cueVideoById.length === cuesBefore
        && $('status').textContent.startsWith(`Added Title ${B} (1 new song).`)
        && $('plName').textContent === `Title ${A} + Title ${B}`,
      ids, status: $('status').textContent, heading: $('plName').textContent,
    };
  },

  // Pasting a playlist that's already in the list says so.
  async 'already-in-list'() {
    await import('/app.js');
    await wait(800);
    submitLink(`https://www.youtube.com/playlist?list=${A}`);
    await wait(200);
    return { pass: $('status').textContent.startsWith('That playlist is already in your list.'), status: $('status').textContent };
  },

  // A playlist that fails at startup keeps its songs' settings and doesn't remove songs shared with another playlist.
  async 'startup-failed-source'() {
    localStorage.setItem('hr:rotation', JSON.stringify({
      sources: [A, 'PLXXXX'], weights: { [A1]: 5 }, extras: [], removed: ['zzzzzzzzzz1'], sourceInfo: {},
    }));
    await import('/app.js');
    await wait(2500);
    const rot = saved();
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return {
      pass: ids.join() === [A1, A2].join() && rot.sources.join() === [A, 'PLXXXX'].join()
        && rot.removed.includes('zzzzzzzzzz1') && rot.sourceInfo.PLXXXX?.status === 'error' && rot.weights[A1] === 5
        && $('status').classList.contains('err'),
      ids, rot, status: $('status').textContent,
    };
  },

  // Adding a video before the playlists finish reading keeps saved added songs and removed songs.
  async 'add-video-before-load'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: ['xxxxxxxxxx1'], removed: [A2], sourceInfo: {} }));
    cueDelay[A] = 1500;
    await import('/app.js');
    await wait(50);
    $('addLink').value = `https://youtu.be/${B1}`;
    $('addForm').requestSubmit();
    await wait(100);
    const early = saved();
    await wait(2500);
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return {
      pass: early.extras.includes('xxxxxxxxxx1') && early.extras.includes(B1) && early.removed.includes(A2)
        && !ids.includes(A2) && ids.includes('xxxxxxxxxx1'),
      early, ids,
    };
  },

  // Remembered titles show straight away; fresh ones aren't looked up again; stale ones are.
  async 'titles-remembered'() {
    localStorage.setItem('hr:titles', JSON.stringify({
      [A1]: { title: 'Remembered A1', author: 'Mara', thumbnail: '', at: Date.now() },
      [A2]: { title: 'Old A2', author: '', thumbnail: '', at: 0 },
    }));
    await import('/app.js');
    await wait(800);
    const titleOf = id => document.querySelector(`.song[data-id="${id}"] .t`)?.textContent;
    const stored = JSON.parse(localStorage.getItem('hr:titles'));
    return {
      pass: titleOf(A1) === 'Remembered A1' && !calls.oembed.includes(A1) && calls.oembed.includes(A2)
        && titleOf(A2) === `Title ${A2}` && stored[A2].title === `Title ${A2}` && stored[A2].at > 0,
      a1: titleOf(A1), a2: titleOf(A2), lookups: calls.oembed,
    };
  },

  // While playlists are being read, the song list shows a loading line; it goes away when they're in.
  async 'loading-state'() {
    cueDelay[A] = 1000;
    await import('/app.js');
    await wait(300);
    const box = $('listLoading');
    const shownWhileReading = !!box && !box.hidden;
    await wait(1500);
    return { pass: shownWhileReading && box.hidden && document.querySelectorAll('.song').length === 2, shownWhileReading, hiddenAfter: box?.hidden };
  },

  // An empty pen gets 4–6 untagged visitors (tooltip only); they walk out when the first real creature hatches.
  async 'pen-visitors'() {
    await import('/app.js');
    await wait(800);
    const visitors = [...document.querySelectorAll('#yard .cr.visitor')];
    const untagged = visitors.every(v => !v.querySelector('.tag') && v.querySelector('.tip')?.textContent === 'Play a song to build your own crew');
    const models = visitors.map(v => v.dataset.model);
    const different = new Set(models).size === models.length;
    // Nothing is playing yet, so the pen is paused; visitors keep animating anyway. (Headless Chrome draws
    // no animation frames while the harness waits, so walking distance can't be measured here.)
    const moved = $('yard').classList.contains('paused')
      && visitors.every(v => getComputedStyle(v.querySelector('.kn')).animationPlayState === 'running');
    $('playBtn').click();
    await wait(300);
    const leaving = document.querySelectorAll('#yard .cr.visitor.leaving').length;
    const real = document.querySelectorAll('#yard .cr:not(.visitor)').length;
    return {
      pass: visitors.length >= 4 && visitors.length <= 6 && untagged && different && moved && leaving === visitors.length && real === 1,
      visitors: visitors.length, untagged, models, different, moved, leaving, real,
    };
  },

  // The ⚙ opens the Manage playlists modal over the player; the song keeps playing; × closes it.
  async 'modal-opens'() {
    await import('/app.js');
    await wait(800);
    $('playBtn').click();
    await wait(300);
    const title = $('nowTitle').textContent, loads = calls.loadVideoById.length;
    $('manageBtn').click();
    await wait(100);
    const open = $('manageDialog').open;
    const cards = document.querySelectorAll('#mSources .source').length;
    $('manageDialog').querySelector('[data-close]').click();
    await wait(100);
    return {
      pass: open && cards === 1 && !$('manageDialog').open && $('nowTitle').textContent === title && calls.loadVideoById.length === loads,
      open, cards, closed: !$('manageDialog').open,
    };
  },

  // Removing a playlist in the modal takes its songs out at once; Undo brings them back.
  async 'modal-remove-undo'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A, B], weights: { [A1]: 5 }, extras: [], removed: [], sourceInfo: {} }));
    await import('/app.js');
    await wait(1000);
    $('manageBtn').click();
    const ids = () => [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort().join();
    const before = ids();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="remove"]`).click();
    await wait(100);
    const afterRemove = ids(), sourcesAfter = saved().sources.join();
    const note = $('mStatus').textContent;
    [...$('mStatus').querySelectorAll('button')].find(b => b.textContent === 'Undo').click();
    await wait(200);
    return {
      pass: before === [A1, A2, B1].join() && afterRemove === B1 && sourcesAfter === B && note.startsWith(`Removed Title ${A}.`)
        && ids() === before && saved().sources.join() === [A, B].join() && saved().weights[A1] === 5,
      before, afterRemove, note, after: ids(),
    };
  },

  // Adding a playlist in the modal reads it straight away; Start over empties the list but keeps weights.
  async 'modal-add-start-over'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: { [A1]: 5 }, extras: [B1], removed: [], sourceInfo: {} }));
    await import('/app.js');
    await wait(1000);
    $('manageBtn').click();
    const addedHere = document.querySelectorAll('#mExtras .source').length;
    $('mAddLink').value = `https://www.youtube.com/playlist?list=${C}`;
    $('mAddForm').requestSubmit();
    await wait(800);
    const card = document.querySelector(`#mSources .source[data-id="${C}"]`)?.textContent ?? '';
    const withC = document.querySelectorAll('.song').length;
    $('mStartOver').click();
    $('mConfirmClear').click();
    await wait(200);
    const rot = saved();
    return {
      pass: addedHere === 1 && card.includes('5 songs') && withC === 8
        && rot.sources.length === 0 && rot.extras.length === 0 && rot.weights[A1] === 5 && document.querySelectorAll('.song').length === 0,
      addedHere, card, withC, rot,
    };
  },

  // ↻ Sync on one playlist re-reads just that one, brings back its removed songs and refreshes its titles.
  async 'modal-sync-playlist'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A, B], weights: {}, extras: [], removed: [A2, B1], sourceInfo: {} }));
    localStorage.setItem('hr:titles', JSON.stringify({ [A1]: { title: 'Remembered A1', author: '', thumbnail: '', at: Date.now() } }));
    await import('/app.js');
    await wait(1000);
    const readsA = calls.cuePlaylist[A], readsB = calls.cuePlaylist[B];
    $('manageBtn').click();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="sync"]`).click();
    await wait(1000);
    const has = id => !!document.querySelector(`.song[data-id="${id}"]`);
    const titleA1 = document.querySelector(`.song[data-id="${A1}"] .t`)?.textContent;
    return {
      pass: has(A2) && !has(B1) && saved().removed.join() === B1 && calls.cuePlaylist[A] === readsA + 1
        && calls.cuePlaylist[B] === readsB && titleA1 === `Title ${A1}` && $('mStatus').textContent.startsWith(`Synced Title ${A}.`),
      removed: saved().removed, reads: calls.cuePlaylist, titleA1, note: $('mStatus').textContent,
    };
  },

  // The modal's added songs show remembered titles without looking them up again.
  async 'modal-remembered-titles'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [], weights: {}, extras: [B1], removed: [], sourceInfo: {} }));
    localStorage.setItem('hr:titles', JSON.stringify({ [B1]: { title: 'Remembered B1', author: 'Mara', thumbnail: '', at: Date.now() } }));
    await import('/app.js');
    await wait(300);
    $('manageBtn').click();
    const text = document.querySelector('#mExtras .source .t')?.textContent;
    return { pass: text === 'Remembered B1' && !calls.oembed.includes(B1), text, lookups: calls.oembed };
  },

  // A song added back after its playlist was removed (in the modal) stays in the list as an added song.
  async 'readd-after-playlist-removed'() {
    await import('/app.js');
    await wait(800);
    const row = document.querySelector(`.song[data-id="${A2}"]`);
    row.querySelector('[data-role="menu"]').click();
    row.querySelector('[data-role="remove"]').click();
    await wait(100);
    $('manageBtn').click();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="remove"]`).click();
    $('manageDialog').querySelector('[data-close]').click();
    await wait(200);
    $('addLink').value = `https://youtu.be/${A2}`;
    $('addForm').requestSubmit();
    await wait(200);
    return { pass: saved().extras.includes(A2) && !!document.querySelector(`.song[data-id="${A2}"]`), rot: saved() };
  },

  // A failed Sync keeps the playlist's songs; removing another playlist later doesn't drop them.
  async 'failed-sync-keeps-songs'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A, B], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    await import('/app.js');
    await wait(1000);
    delete playlists[A];                       // A can't be read any more
    $('manageBtn').click();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="sync"]`).click();
    await wait(2000);
    document.querySelector(`#mSources .source[data-id="${B}"] [data-action="remove"]`).click();
    await wait(200);
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return { pass: ids.join() === [A1, A2].join() && $('mStatus').textContent !== '', ids };
  },

  // Another tab adds a playlist: this tab picks it up, and its own saves keep it.
  async 'other-tab-adds-playlist'() {
    await import('/app.js');
    await wait(800);
    localStorage.setItem('hr:rotation', JSON.stringify({ ...saved(), sources: [A, B] }));
    window.dispatchEvent(new StorageEvent('storage', { key: 'hr:rotation' }));
    await wait(500);
    const input = $(`w-${A1}`);
    input.value = '3';
    input.dispatchEvent(new Event('change', { bubbles: true }));
    await wait(100);
    return { pass: !!document.querySelector(`.song[data-id="${B1}"]`) && saved().sources.join() === [A, B].join(), sources: saved().sources };
  },

  // A read that times out and answers late isn't credited to the next playlist.
  async 'late-answer-not-misfiled'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [SLOW, B], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    cueDelay[B] = 400;
    await import('/app.js');
    await wait(4000);
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id);
    return { pass: ids.join() === B1 && saved().sourceInfo[SLOW]?.status === 'error', ids, info: saved().sourceInfo };
  },

  // Sync before YouTube's player is ready says so, and doesn't mark the playlist as broken.
  async 'sync-before-ready'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    readyDelay = 1500;
    await import('/app.js');
    await wait(100);
    $('manageBtn').click();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="sync"]`).click();
    await wait(100);
    const note = $('mStatus').textContent;
    const status = saved().sourceInfo[A]?.status;
    await wait(2000);
    return { pass: note.startsWith('The YouTube player is still loading.') && status !== 'error' && document.querySelectorAll('.song').length === 2, note, status };
  },

  // Pasting a playlist that had its own saved entry in the old version brings back its weights and removed songs.
  async 'old-playlist-weights-return'() {
    localStorage.setItem(`hr:playlist:${C}`, JSON.stringify({ weights: { [CS[0]]: 7 }, extras: [], removed: [CS[1]] }));
    await import('/app.js');
    await wait(800);
    submitLink(`https://www.youtube.com/playlist?list=${C}`);
    await wait(800);
    const weight = $(`w-${CS[0]}`)?.value;
    return {
      pass: weight === '7' && !document.querySelector(`.song[data-id="${CS[1]}"]`) && localStorage.getItem(`hr:playlist:${C}`) === null,
      weight, rot: saved(),
    };
  },

  // The open modal isn't rebuilt when nothing in it changed, so keyboard focus stays put.
  async 'modal-keeps-focus'() {
    await import('/app.js');
    await wait(800);
    $('manageBtn').click();
    const button = document.querySelector(`#mSources .source[data-id="${A}"] [data-action="remove"]`);
    button.focus();
    $('playBtn').click();                    // the player changes; the modal's data doesn't
    await wait(300);
    return { pass: document.activeElement === button, focused: document.activeElement?.textContent };
  },

  // Removing a playlist while it's still loading leaves nothing behind.
  async 'remove-while-loading'() {
    await import('/app.js');
    await wait(800);
    cueDelay[C] = 800;
    $('manageBtn').click();
    $('mAddLink').value = `https://www.youtube.com/playlist?list=${C}`;
    $('mAddForm').requestSubmit();
    await wait(100);
    document.querySelector(`#mSources .source[data-id="${C}"] [data-action="remove"]`).click();
    await wait(1500);
    const rot = saved();
    return {
      pass: !rot.sources.includes(C) && !(C in rot.sourceInfo) && !$('mStatus').textContent.startsWith('Added') && !document.querySelector(`.song[data-id="${CS[0]}"]`),
      rot, note: $('mStatus').textContent,
    };
  },

  // Sync looks each song's title up once, and shows the loading line while it reads.
  async 'sync-one-lookup-and-loading'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: [], removed: [A2], sourceInfo: {} }));
    await import('/app.js');
    await wait(800);
    cueDelay[A] = 600;
    const lookupsBefore = calls.oembed.filter(id => id === A2).length;
    $('manageBtn').click();
    document.querySelector(`#mSources .source[data-id="${A}"] [data-action="sync"]`).click();
    await wait(200);
    const loadingShown = !$('listLoading').hidden;
    await wait(1200);
    const lookups = calls.oembed.filter(id => id === A2).length - lookupsBefore;
    return { pass: loadingShown && lookups === 1 && $('listLoading').hidden, loadingShown, lookups };
  },

  // Tooltips sit on their own button: every element with a tooltip is positioned, so its tooltip anchors to it.
  async 'tooltips-anchored'() {
    await import('/app.js');
    await wait(800);
    $('manageBtn').click();
    const withTips = [...document.querySelectorAll('[data-tip]')];
    const unanchored = withTips.filter(el => getComputedStyle(el).position === 'static').map(el => el.id || el.textContent.trim());
    return { pass: withTips.length >= 4 && unanchored.length === 0, count: withTips.length, unanchored };
  },

  // Saved data from the old version (one entry per playlist) becomes the current format.
  async 'migrates-old-saved-data'() {
    localStorage.removeItem('hr:rotation');
    localStorage.setItem(`hr:playlist:${A}`, JSON.stringify({ weights: { [A1]: 5 }, extras: [B1], removed: [A2] }));
    localStorage.setItem('hr:settings', JSON.stringify({ lastSource: { type: 'playlist', id: A }, endMode: 'shuffle' }));
    await import('/app.js');
    await waitFor(() => document.querySelectorAll('.song').length === 2);
    const rot = saved();
    const ids = [...document.querySelectorAll('.song')].map(li => li.dataset.id).sort();
    return {
      pass: rot.sources.join() === A && rot.weights[A1] === 5 && rot.extras.join() === B1 && rot.removed.join() === A2 && ids.join() === [A1, B1].join(),
      rot, ids,
    };
  },

  // A video that won't play here is marked "Can't play here" and skipped.
  async 'blocked-video-skipped'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [C], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    blocked.add(CS[2]);
    await import('/app.js');
    await waitFor(() => document.querySelectorAll('.song').length === 5);
    $('playBtn').click();
    for (let i = 0; i < 6; i++) {
      await wait(100);
      $('nextBtn').click();
    }
    await wait(200);
    const row = document.querySelector(`.song[data-id="${CS[2]}"]`);
    return {
      pass: row.classList.contains('blocked') && row.textContent.includes("Can't play here") && $('nowTitle').textContent !== `Title ${CS[2]}`,
      blocked: row.classList.contains('blocked'), now: $('nowTitle').textContent,
    };
  },

  // "Stop after this loop" stops at the end of the loop instead of starting a new one.
  async 'stop-at-end-of-loop'() {
    localStorage.setItem('hr:rotation', JSON.stringify({ sources: [A], weights: {}, extras: [], removed: [], sourceInfo: {} }));
    await import('/app.js');
    await waitFor(() => document.querySelectorAll('.song').length === 2);
    document.querySelector('#endMode [data-mode="stop"]').click();
    $('playBtn').click();
    await wait(100);
    $('nextBtn').click();                    // second (last) song of the 2-song loop
    await wait(100);
    $('nextBtn').click();                    // end of the loop: stop
    await wait(100);
    return { pass: calls.stopVideo >= 1 && $('nowTitle').textContent === 'Nothing playing', stops: calls.stopVideo, now: $('nowTitle').textContent };
  },

  // Any message can be closed with its × button.
  async 'dismiss-note'() {
    await import('/app.js');
    await wait(300);
    submitLink('https://example.com/nope');
    await wait(100);
    const shown = !$('status').hidden;
    $('status').querySelector('button[aria-label="Dismiss"]')?.click();
    await wait(100);
    return { pass: shown && $('status').hidden, shown, hidden: $('status').hidden };
  },

  // A typed weight outside 1–99 must show the stored value, not what was typed.
  async 'typed-weight'() {
    await import('/app.js');
    await wait(300);
    const input = $(`w-${A1}`);
    input.focus();
    input.value = '150';
    input.dispatchEvent(new Event('change', { bubbles: true }));
    await wait(100);
    const stored = saved().weights[A1];
    return { pass: input.value === '99' && stored === 99, shown: input.value, stored };
  },
};

let result;
try {
  result = await scenarios[scenario]();
} catch (e) {
  result = { pass: false, error: String(e.stack || e) };
}
const out = document.createElement('pre');
out.id = 'result';
out.textContent = `RESULT:${JSON.stringify({ scenario, ...result })}`;
document.body.append(out);
</script>
